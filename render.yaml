services:
  - type: web
    name: waymate-backend
    env: node
    plan: free
    rootDir: waymate-launch-v2/backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: waymate-f9de0
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        value: waymate-f9de0.firebasestorage.app
      - key: DOCUMENT_STORAGE
        value: firebase
      - key: ADMIN_UIDS
        sync: false
